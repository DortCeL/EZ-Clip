appId: com.ezclip.app
productName: Ez-clip
artifactName: setup.${ext}
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/@derhuerst/ffprobe-static/**
extraResources:
  - from: resources/fast-forward.png
    to: fast-forward.png
win:
  icon: build/icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  warningsAsErrors: false
