appId: com.ezclip.app
productName: Ez-clip
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/@derhuerst/ffprobe-static/**
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
